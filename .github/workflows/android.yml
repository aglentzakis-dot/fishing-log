name: Fish IQ — APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - package.json
      - capacitor.config.json
      - android-*.mjs
      - .github/workflows/android.yml

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Βιβλιοθήκες
        run: npm install --no-audit --no-fund

      - name: Ιστοσελίδα για την εφαρμογή (www)
        run: node android-prepare-web.mjs

      - name: Δημιουργία έργου Android
        run: npx cap add android

      - name: Συγχρονισμός
        run: npx cap sync android

      - name: Άδειες, εικονίδιο, έκδοση
        run: node android-patch.mjs

      - name: Μεταγλώττιση APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Όνομα αρχείου
        run: |
          VER=$(grep -o 'Fish IQ · έκδοση [0-9]*\.[0-9]*' index.html | grep -o '[0-9]*\.[0-9]*$')
          cp android/app/build/outputs/apk/debug/app-debug.apk "Fish-IQ-${VER}.apk"
          echo "APK_FILE=Fish-IQ-${VER}.apk" >> "$GITHUB_ENV"

      - name: Σκέτο APK για λήψη (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest "$APK_FILE" \
            --prerelease \
            --title "Fish IQ — APK για δοκιμή" \
            --notes "Αυτόματη μεταγλώττιση. Κατέβασε το αρχείο .apk και άνοιξέ το στο κινητό."

      - name: Αντίγραφο ως αρχείο εκτέλεσης
        uses: actions/upload-artifact@v4
        with:
          name: Fish-IQ-apk
          path: ${{ env.APK_FILE }}
          retention-days: 14
